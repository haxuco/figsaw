<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#161d18">
  <title>Figsaw</title>
  <meta name="description" content="Figsaw in an abandoned technology office, with three worried Figpals hanging from chain winches over bubbling green vats along the left side.">
  <link rel="icon" href="data:,">
  <link rel="preload" href="./fonts/grenze-gotisch-latin.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="./style.css?v=a1eb9574b65e">
  <link rel="modulepreload" href="./game.bundle.js?v=956ad48f7eae">
</head>
<body>
  <div id="loading-status" role="status" aria-live="polite" aria-busy="true">
    <div class="loading-card">
      <p id="loading-message">Entering the office…</p>
      <progress id="loading-progress" max="100" aria-label="Loading Figsaw"></progress>
    </div>
  </div>
  <canvas id="scene" tabindex="0" aria-label="An abandoned technology office with three Figpals suspended above green vats, a closed MacBook Pro and a red countdown timer on the floor, and Figsaw on a tricycle. Drag or use arrow keys to look around; scroll to zoom."></canvas>
  <output id="frame-rate" aria-label="Frames per second" aria-live="off">— FPS</output>
  <button id="cancel-axe-selection" type="button" hidden>Put axe back</button>
  <button id="cancel-saw-selection" type="button" hidden>Put saw down</button>
  <div id="mug-eye-impact" aria-hidden="true" hidden></div>
  <div id="death-blood" aria-hidden="true" hidden></div>
  <section id="game-over" role="dialog" aria-modal="true" aria-labelledby="game-over-title" hidden>
    <div class="game-over-content" hidden>
      <h1 id="game-over-title">Game over</h1>
      <button id="restart-game" type="button">Try again</button>
    </div>
  </section>
  <div id="figsaw-dialogue" hidden aria-hidden="true">
    <div class="dialogue-bubble"><strong>Figsaw</strong> <span>I want to play a game...</span></div>
  </div>
  <dialog id="saw-menu" aria-labelledby="saw-menu-title">
    <h2 id="saw-menu-title">What do you want to saw?</h2>
    <div class="saw-object-choices">
      <button type="button" data-saw="shackle" aria-label="Saw shackle">
        <span class="saw-choice-label saw-object"><img src="./assets/saw-choices/shackle.png" alt="" width="384" height="384" decoding="async" loading="lazy" draggable="false"><svg class="saw-choice-lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg></span>
      </button>
      <button type="button" data-saw="animal" aria-label="Saw stuffed animal">
        <span class="saw-choice-label saw-object"><img src="./assets/saw-choices/stuffed-elephant.png" alt="" width="384" height="384" decoding="async" loading="lazy" draggable="false"><svg class="saw-choice-lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg></span>
      </button>
    </div>
    <button type="button" data-saw="cancel"><span class="saw-choice-label">Cancel</span></button>
  </dialog>
  <button id="leave-chair" class="inspection-back" type="button" hidden>‹ LEAVE CHAIR</button>
  <button id="inspection-back" class="inspection-back" type="button" hidden aria-label="Back to room">‹ BACK</button>
  <section id="escaped" role="dialog" aria-modal="true" aria-labelledby="escaped-title" hidden><h1 id="escaped-title">You escaped.</h1><p>A little perspective changes everything.</p><button id="new-game">Play again</button></section>
  <div id="chain-menu" role="menu" aria-label="Chain instance" hidden>
    <button type="button" role="menuitem" aria-keyshortcuts="Alt+Meta+B">
      <svg class="detach-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <g stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
          <path d="m14 9.5 3-3a3.18 3.18 0 0 0-4.5-4.5L10 4.5M10 14.5l-3 3a3.18 3.18 0 0 1-4.5-4.5L5 10.5" transform="translate(2 1)"/>
          <path d="m10 10 4-4m-4 12 4-4M4 4h2M4 4V2m16 18h-2m2 0v2"/>
        </g>
      </svg>
      <span>Detach instance</span><kbd aria-hidden="true">⌥⌘B</kbd>
    </button>
  </div>
  <p id="restraint-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  <div id="figpal-dialogues" hidden aria-hidden="true"></div>
  <p id="dialogue-announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  <p id="game-countdown" class="sr-only" role="timer" aria-live="off" aria-label="Game countdown">05:00</p>
  <p id="countdown-announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  <p id="hoist-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  <div class="view-tools">
    <button id="copy-view" type="button" title="Copy the current camera view as a prompt">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5" y="5" width="8" height="8" rx="1.5" stroke="currentColor"/><path d="M10 3H4a1 1 0 0 0-1 1v6" stroke="currentColor" stroke-linecap="round"/></svg>
      <span>Copy view</span>
    </button>
    <div id="copy-fallback" hidden>
      <label for="view-text">Copy this view and paste it into the chat.</label>
      <textarea id="view-text" readonly spellcheck="false" rows="10"></textarea>
      <button id="close-copy" type="button">Close</button>
    </div>
  </div>
  <p id="copy-status" class="sr-only" role="status" aria-live="polite"></p>
  <script type="module" src="./boot.js?v=956ad48f7eae"></script>
</body>
</html>
