ISION</text><path d="M1065 208h445M1525 165V920" stroke="#788a7b" fill="none"/><rect x="1070" y="245" width="405" height="160" fill="#dedcc3" opacity=".32" stroke="#7c8670" stroke-dasharray="5 8"/><text x="1090" y="295" font-size="23" >Who owns the sequence?</text><rect x="1070" y="445" width="405" height="160" fill="#dedcc3" opacity=".32" stroke="#7c8670" stroke-dasharray="5 8"/><text x="1090" y="495" font-size="23" >What does “done” mean?</text><path d="M130 774h280v110H130Z M660 774h280v110H660Z M1170 774h280v110h-280Z M420 830h227l-16-10m16 10l-16 10M950 830h207l-16-10m16 10l-16 10" fill="none" stroke="#54706a" stroke-width="3"/><text x="166" y="837" font-size="27" >Observe</text><text x="700" y="837" font-size="27" >Reframe</text><text x="1217" y="837" font-size="27" >Try again</text><text x="70" y="969" font-size="23" fill="#8e594c" font-style="italic">We are not our users. Change the angle before changing the design.</text><rect x="630" y="255" width="360" height="140" fill="#d2d8ce" opacity=".65"/><path d="M633 275l332 12m-328 24 341 11m-338 23 310 8" stroke="#d2d8ce" stroke-width="22" opacity=".8"/></g><path d="M18 0q-4 28 5 18" fill="none" stroke="#635b3d" stroke-width="1" opacity=".12"/><path d="M191 0q-4 28 5 21" fill="none" stroke="#635b3d" stroke-width="2" opacity=".12"/><path d="M364 0q-4 28 5 24" fill="none" stroke="#635b3d" stroke-width="3" opacity=".12"/><path d="M537 0q-4 28 5 27" fill="none" stroke="#635b3d" stroke-width="1" opacity=".12"/><path d="M710 0q-4 28 5 30" fill="none" stroke="#635b3d" stroke-width="2" opacity=".12"/><path d="M883 0q-4 28 5 33" fill="none" stroke="#635b3d" stroke-width="3" opacity=".12"/><path d="M1056 0q-4 28 5 36" fill="none" stroke="#635b3d" stroke-width="1" opacity=".12"/><path d="M1229 0q-4 28 5 39" fill="none" stroke="#635b3d" stroke-width="2" opacity=".12"/><path d="M1402 0q-4 28 5 42" fill="none" stroke="#635b3d" stroke-width="3" opacity=".12"/><path d="M1575 0q-4 28 5 45" fill="none" stroke="#635b3d" stroke-wid